[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "GPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "Zlib",
  "Unicode-3.0",
  "ISC",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
