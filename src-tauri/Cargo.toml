[package]
name = "FeedMee"
version = "0.22.13"
edition = "2024"
description = "The seriously fast feed reader."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "feedmee_lib"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = [] }
dom_smoothie = "0.18"
feed-rs = "3.0"
flexi_logger = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
opml = "1.1"
reqwest = { version = "0.13", features = ["json", "rustls", "gzip", "brotli"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"
tauri-plugin-opener = "2.6"
tauri-plugin-updater = "2.13"
tauri-plugin-window-state = "2.5"
tokio = { version = "1", features = ["sync"] }
toml = "1.1"
url = "2.5"
webp = "0.3.1"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
