[package]
name = "FeedMee"
version = "1.23.2"
edition = "2024"
description = "The seriously fast feed reader."
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "feedmee_lib"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = [] }
dom_smoothie = "0.19"
feed-rs = "3.0"
flexi_logger = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
opml = "1.1"
reqwest = { version = "0.13", features = ["brotli", "gzip", "json", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
tokio = { version = "1", features = ["sync"] }
toml = "1.2"
url = "2.5"
webp = "0.3.1"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
strip = true
lto = "thin"
