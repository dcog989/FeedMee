version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
      biome:
        patterns:
          - '@biomejs/*'
      test:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
          - 'svelte-check'
          - '@testing-library/*'

  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10