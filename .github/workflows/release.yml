name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node dependencies
        run: bun install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build and bundle
        run: bunx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect artifacts
        run: |
          mkdir -p releases
          find src-tauri/target/release/bundle -type f \( \
            -name "*.AppImage" \
            -o -name "*.AppImage.tar.gz" \
            -o -name "*.AppImage.tar.gz.sig" \
            -o -name "*.deb" \
          \) -exec cp {} releases/ \;

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME}"
          APPIMAGE_SIG=$(cat releases/*.AppImage.tar.gz.sig 2>/dev/null || echo "")
          APPIMAGE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/$(ls releases/*.AppImage.tar.gz | xargs basename)"

          cat > releases/latest.json <<EOF
          {
            "version": "${VERSION#v}",
            "notes": "See release notes on GitHub.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${APPIMAGE_SIG}",
                "url": "${APPIMAGE_URL}"
              }
            }
          }
          EOF

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            releases/*.AppImage
            releases/*.AppImage.tar.gz
            releases/*.AppImage.tar.gz.sig
            releases/*.deb
            releases/latest.json
