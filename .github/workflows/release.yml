name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            bun-${{ hashFiles('bun.lock') }}-
            bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false

      - name: Build Arch package
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p .pkg
          cp PKGBUILD .pkg/
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/.pkg \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Su --noconfirm base-devel webkit2gtk-4.1
              useradd -m builder
              chown -R builder:builder /workspace
              su builder -c 'makepkg -f --noconfirm'
            "

      - name: Upload Arch package
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: false
          files: .pkg/*.pkg.tar.zst
          fail_on_unmatched_files: true

      - name: Upload CHANGELOG
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: false
          files: CHANGELOG.md