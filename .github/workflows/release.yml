name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a half-uploaded release.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: just check

      - name: Test
        run: just test

  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            bun-${{ hashFiles('bun.lock') }}-
            bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate release notes
        id: cog
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a
        with:
          command: changelog
          args: --at ${{ env.TAG }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          releaseBody: ${{ steps.cog.outputs.stdout }}
          releaseDraft: false

      - name: Build Arch package
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p .pkg
          cp PKGBUILD .pkg/
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/.pkg \
            archlinux:base-20261108.0.623074 \
            bash -c "
              pacman -Syu --noconfirm base-devel webkit2gtk-4.1
              useradd -m builder
              chown -R builder:builder /workspace/.pkg
              su builder -c 'makepkg -f --noconfirm'
            "

      - name: Upload Arch package
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          draft: false
          tag_name: ${{ env.TAG }}
          files: .pkg/*.pkg.tar.zst
          fail_on_unmatched_files: true

      - name: Upload CHANGELOG
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          draft: false
          tag_name: ${{ env.TAG }}
          files: CHANGELOG.md
