name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (Linux AppImage)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: bun install

      - name: Build AppImage
        run: bunx tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: |
            src-tauri/target/release/FeedMee
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  build-arch:
    name: Build (Arch Linux Package)
    runs-on: ubuntu-latest
    needs: [build-linux]

    steps:
      - uses: actions/checkout@v7

      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: src-tauri/target/release

      - name: Build Arch package
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace/.pkg \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Su --noconfirm base-devel nodejs webkit2gtk-4.1 gtk3 libayatana-appindicator
              useradd -m builder
              chown -R builder:builder /workspace
              su builder -c 'makepkg -f --noconfirm'
            "

      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: linux-arch
          path: .pkg/*.pkg.tar.zst
          include-hidden-files: true
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install

      - name: Build NSIS installer
        run: bunx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.zip
            src-tauri/target/release/bundle/nsis/*.exe.zip.sig
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: artifacts/linux

      - uses: actions/download-artifact@v8
        with:
          name: windows-nsis
          path: artifacts/windows

      - uses: actions/download-artifact@v8
        with:
          name: linux-arch
          path: artifacts/arch

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.AppImage.tar.gz
            artifacts/linux/**/*.AppImage.tar.gz.sig
            artifacts/windows/*.exe
            artifacts/windows/*.exe.zip
            artifacts/windows/*.exe.zip.sig
            artifacts/arch/*.pkg.tar.zst
          generate_release_notes: true
