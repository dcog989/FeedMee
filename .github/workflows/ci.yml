name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            bun-${{ hashFiles('bun.lock') }}-
            bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Sync SvelteKit
        run: bunx svelte-kit sync

      - name: Install cocogitto
        run: |
          curl -sL https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/cog.tar.gz
          tar xzf /tmp/cog.tar.gz -C /tmp
          sudo install /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
          cog --version

      - name: Check commit messages (Conventional Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cog check "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            cog check "${{ github.event.before }}..${{ github.sha }}"
          else
            git log -1 --format=%B | cog verify --file -
          fi

      - name: Check frontend types
        run: bun run check:types

      - name: Check frontend format & lint
        run: bun run check:frontend

      - name: Check backend
        working-directory: src-tauri
        run: cargo check && cargo clippy --all-targets --all-features -- -D warnings

      - name: Check cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          log-level: warn
          manifest-path: src-tauri/Cargo.toml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            bun-${{ hashFiles('bun.lock') }}-
            bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install

      - name: Sync SvelteKit
        run: bunx svelte-kit sync

      - name: Run tests
        run: bun run test