name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Sync SvelteKit
        run: bunx svelte-kit sync

      - name: Check frontend types
        run: bun run lint:types

      - name: Check frontend lint
        run: bun run lint:frontend

      - name: Install cocogitto
        run: |
          curl -sL https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/cog.tar.gz
          tar xzf /tmp/cog.tar.gz -C /tmp
          sudo install /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
          cog --version

      - name: Check commit messages (Conventional Commits)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cog check "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            cog check "${{ github.event.before }}..${{ github.sha }}"
          else
            git log -1 --format=%B | cog verify --file -
          fi

      - name: Check backend
        working-directory: src-tauri
        run: cargo check --locked && cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn
          manifest-path: src-tauri/Cargo.toml
