pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,ts,svelte}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      fail_text: "Biome check failed."

    - name: rust-fmt
      glob: "*.rs"
      run: rustfmt --check {staged_files}
      fail_text: "Rust formatting check failed."

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
      fail_text: "Commit message must follow Conventional Commits (feat|fix|refactor|chore|docs|style|perf|test|build|ci|revert)."

pre-push:
  jobs:
    - name: check
      run: bun run check
      fail_text: "Full check suite failed. Push aborted."
