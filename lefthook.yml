pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,svelte,json,css}"
      run: just format-staged {staged_files}
      stage_fixed: true

    - name: rust-fmt
      glob: "*.rs"
      run: just format-rust-staged {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    full-check:
      run: just check
    tests:
      run: just test

commit-msg:
  commands:
    cog:
      run: just commit-check {1}
