pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,svelte,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: rust-fmt
      glob: "*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    full-check:
      run: bun run check
    tests:
      run: bun run test

commit-msg:
  commands:
    cog:
      run: cog verify --file {1}